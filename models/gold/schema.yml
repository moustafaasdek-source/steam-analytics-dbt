version: 2

models:
  - name: mart_game_summary
    description: >
      Primary analytics table: one row per game with all metrics pre-joined
      from Silver layer. Includes genres, tags, developers, prices, player counts,
      and derived fields (price_tier, popularity_quartile).
      Expected: ~2,000 rows.
    columns:
      - name: app_id
        description: Unique Steam application identifier
        tests:
          - unique
          - not_null
      - name: app_name
        tests:
          - not_null
      - name: price_tier
        description: "Categorical price bucket: Free to Play, $0-$5, $5-$15, $15-$30, $30+"
        tests:
          - accepted_values:
              values: ['Free to Play', '$0-$5', '$5-$15', '$15-$30', '$30+']
      - name: popularity_quartile
        description: "1=lowest 25%, 4=highest 25% based on peak_players"
        tests:
          - accepted_values:
              values: [1, 2, 3, 4]

  - name: mart_genre_performance
    description: >
      Genre-level aggregations for Tableau genre analysis view.
      One row per genre with game count, avg/median peak players,
      free-to-play percentage, avg price, and avg languages.
      Filtered to genres with 5+ games.
    columns:
      - name: genre
        tests:
          - unique
          - not_null
      - name: game_count
        description: "Number of games in this genre (minimum 5)"

  - name: mart_pricing_analysis
    description: >
      Price tier aggregations for Tableau pricing analysis view.
      One row per price tier showing engagement metrics.
      Filtered to app_type = 'game' only.
    columns:
      - name: price_tier
        tests:
          - unique
          - not_null
      - name: tier_sort_order
        description: "Numeric sort order: 0=Free, 1=$0-$5, 2=$5-$15, 3=$15-$30, 4=$30+"

  - name: mart_player_trends
    description: >
      Monthly platform-wide player trends with Year-over-Year growth.
      One row per year-month (YYYY-MM format).
      Date range: 2017-12 to 2020-08.
    columns:
      - name: year_month
        tests:
          - unique
          - not_null
      - name: yoy_growth_pct
        description: "Year-over-year growth percentage (null for first year)"

  # ── Star Schema: Dimensions ──────────────────────────────────

  - name: dim_games
    description: >
      Central game dimension table. One row per Steam application.
      Enriches stg_games with aggregated counts from bridge tables
      and summary metrics from player counts and prices.
      Join to all fact and bridge tables via app_id.
    columns:
      - name: app_id
        description: Unique Steam application identifier
        tests:
          - unique
          - not_null
      - name: app_name
        tests:
          - not_null
      - name: price_tier
        description: "Categorical price bucket: Free to Play, $0-$5, $5-$15, $15-$30, $30+"
      - name: popularity_quartile
        description: "1=lowest 25%, 4=highest 25% based on peak_players"

  - name: dim_genres
    description: >
      Genre bridge table. One row per (app_id, genre).
      Join to dim_games on app_id.
    columns:
      - name: app_id
        tests:
          - not_null
      - name: genre
        tests:
          - not_null

  - name: dim_tags
    description: >
      Community tag bridge table. One row per (app_id, tag).
      Join to dim_games on app_id.
    columns:
      - name: app_id
        tests:
          - not_null
      - name: tag
        tests:
          - not_null

  - name: dim_developers
    description: >
      Developer bridge table. One row per (app_id, developer).
      Join to dim_games on app_id.
    columns:
      - name: app_id
        tests:
          - not_null
      - name: developer
        tests:
          - not_null

  - name: dim_publishers
    description: >
      Publisher bridge table. One row per (app_id, publisher).
      Join to dim_games on app_id.
    columns:
      - name: app_id
        tests:
          - not_null
      - name: publisher
        tests:
          - not_null

  - name: dim_languages
    description: >
      Supported languages bridge table. One row per (app_id, language).
      Join to dim_games on app_id.
    columns:
      - name: app_id
        tests:
          - not_null
      - name: language
        tests:
          - not_null

  # ── Star Schema: Facts ───────────────────────────────────────

  - name: fact_player_counts
    description: >
      Daily player count fact table. One row per (app_id, activity_date).
      Date range: Dec 2017 – Aug 2020 (~24.3M rows).
      Join to dim_games on app_id.
    columns:
      - name: app_id
        tests:
          - not_null
      - name: activity_date
        tests:
          - not_null

  - name: fact_prices
    description: >
      Daily price observation fact table. One row per (app_id, price_date).
      Date range: Apr 2019 – Aug 2020 (725,268 rows).
      Join to dim_games on app_id.
    columns:
      - name: app_id
        tests:
          - not_null
      - name: price_date
        tests:
          - not_null